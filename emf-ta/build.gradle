dependencies {
  // openflexo dep
  implementation flexoFoundation()
  implementation flexoUtils()
  implementation flexoOntology()
  // external dep
  // Following dependency (xtext) has been replaced with new version of EMF
  //implementation 'org.eclipse.xtext:org.eclipse.xtext.xtext:2.10.0'
  implementation 'org.eclipse.emf:org.eclipse.emf.ecore:2.43.0'
  implementation 'org.eclipse.emf:org.eclipse.emf.ecore.xmi:2.41.0'
  implementation 'org.eclipse.uml2:uml-resources:5.0.1'
  implementation 'org.eclipse.uml2:common:2.0.1'
  implementation 'org.eclipse.uml2:uml:5.0.1'
  runtimeOnly 'org.eclipse.uml2:types:2.0.0'
  runtimeOnly 'org.eclipse.uml2.uml:profile-standard:1.0.0'
  // testing dep
  testImplementation flexoFoundationTest()

  // This resource center must always be present at run-time
  runtimeOnly project(':emf-ta-rc')

  // Test resource center
  testRuntimeOnly project(':emf-ta-test-rc')
}
